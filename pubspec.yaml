name: chatwoot_sdk
description: A flutter client sdk for chatwoot. Integrate Chatwoot flutter client into your flutter app and talk to your visitors/users in real time.
version: 0.1.0
homepage: https://github.com/chatwoot/chatwoot-flutter-sdk

environment:
  sdk: "^3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_chat_ui: ^2.12.0
  flutter_chat_core: ^2.9.1
  material_ui: ^1.7.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  json_annotation: ^4.12.0
  dio: ^5.11.1
  equatable: ^3.0.0
  synchronized: ^3.4.2
  intl: ^0.20.3
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  google_fonts: ^9.0.0
  record: ^7.1.2
  just_audio: ^0.10.0
  file_picker: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  hive_ce_generator: ^1.11.3
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  fake_async: ^1.3.3

