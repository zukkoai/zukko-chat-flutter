name: zukko_chat_flutter
description: "Native Flutter chat SDK for Zukko Chat: real-time messaging, file and voice attachments, three customizable UI styles, light/dark themes and secure HMAC user identity."
homepage: https://zukko.ai/en
repository: https://github.com/zukkoai/zukko-chat-flutter
issue_tracker: https://github.com/zukkoai/zukko-chat-flutter/issues
version: 1.0.1

environment:
  sdk: "^3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_chat_ui: ^2.12.0
  flutter_chat_core: ^2.9.1
  material_ui: ^1.7.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  json_annotation: ^4.12.0
  dio: ^5.11.1
  equatable: ^3.0.0
  synchronized: ^3.4.2
  intl: ^0.20.3
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  record: ^7.1.2
  just_audio: ^0.10.0
  file_picker: ^13.0.0
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  hive_ce_generator: ^1.12.0
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  fake_async: ^1.3.3
  crypto: ^3.0.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # Bundled style fonts (SIL OFL 1.1, license next to each family). Used by the
  # chat styles as 'packages/zukko_chat_flutter/<Family>'.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
    - family: Onest
      fonts:
        - asset: assets/fonts/onest/Onest-Regular.ttf
        - asset: assets/fonts/onest/Onest-SemiBold.ttf
          weight: 600
