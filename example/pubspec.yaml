name: example
description: Demo app of the Zukko Chat Flutter SDK.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: "^3.13.0"

dependencies:
  flutter:
    sdk: flutter
  # DateFormat for ZukkoChatOptions.timeFormat (the SDK itself depends on intl).
  intl: ^0.20.3
  zukko_chat_flutter:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
